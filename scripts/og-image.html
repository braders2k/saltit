<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px;
    box-sizing: border-box;
    padding: 64px 80px 0;
    display: flex; flex-direction: column;
    background:
      linear-gradient(90deg, rgba(250, 251, 252, 0.97) 0%, rgba(250, 251, 252, 0.93) 50%, rgba(250, 251, 252, 0.55) 100%),
      url("../site/assets/lido-1024.webp") 70% 45% / cover no-repeat,
      #fafbfc;
    border-bottom: 10px solid #7eb8d4;
    color: #2b2f33;
    font-family: "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 22px; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  .brand img { width: 72px; height: 72px; }
  .eyebrow { display: flex; align-items: center; gap: 18px; margin: 64px 0 20px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #4a7488; font-weight: 600; }
  .eyebrow::before { content: ""; width: 48px; height: 3px; background: #7eb8d4; }
  h1 { margin: 0; font-size: 104px; line-height: 0.98; letter-spacing: -0.045em; font-weight: 700; max-width: 11ch; }
</style>
</head>
<body>
  <div class="brand"><img src="../site/assets/mark.svg" alt="">Salt IT</div>
  <p class="eyebrow">Salt IT · Brad · Based in Saltdean</p>
  <h1>Home IT support in Saltdean.</h1>
</body>
</html>
