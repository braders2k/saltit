<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px;
    box-sizing: border-box;
    padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #0a0b0d; color: #fff;
    font-family: "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 22px; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  .coords, .foot { font-family: "DejaVu Sans Mono", Menlo, monospace; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #b7bcc2; }
  h1 { margin: 0; font-size: 104px; line-height: 0.98; letter-spacing: -0.045em; font-weight: 700; max-width: 11ch; }
  .rule { height: 1px; background: #2a2d31; margin-bottom: 24px; }
  .foot b { color: #ff6b35; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 28 28" width="48" height="48"><rect width="28" height="15" fill="#fff"/><rect y="19" width="28" height="9" fill="#fff"/></svg>
      Salt IT
    </div>
    <div class="coords">50.80° N  0.04° W</div>
  </div>
  <h1>Home IT support in Saltdean.</h1>
  <div>
    <div class="rule"></div>
    <div class="foot"><b>Salt IT</b> · Home IT support in Saltdean · East Sussex</div>
  </div>
</body>
</html>
