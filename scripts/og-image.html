<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- Source for site/assets/og-image.jpg. Screenshot this page at 1200×630 (see README). -->
<style>
  @font-face { font-family: "Barlow"; src: url("../site/assets/fonts/barlow-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Barlow"; src: url("../site/assets/fonts/barlow-600.woff2") format("woff2"); font-weight: 600; }
  html, body { margin: 0; }
  body {
    position: relative;
    width: 1200px; height: 630px;
    box-sizing: border-box;
    padding: 60px 72px 0;
    overflow: hidden;
    background: #050d14;
    color: #f2f4f3;
    font-family: "Barlow", Arial, sans-serif;
  }
  .lido {
    position: absolute;
    right: -90px; bottom: -40px;
    width: 780px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 48%), linear-gradient(180deg, transparent 0%, #000 30%, #000 80%, transparent 100%);
    -webkit-mask-composite: source-in;
  }
  .brand { position: relative; display: flex; align-items: center; gap: 20px; font-size: 34px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; }
  .brand img { width: 64px; height: 64px; }
  .eyebrow { position: relative; display: flex; align-items: center; gap: 14px; margin: 70px 0 18px; font-size: 22px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #3ec6cf; }
  .eyebrow::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #3ec6cf; box-shadow: 0 0 0 6px rgba(62, 198, 207, 0.2); }
  h1 { position: relative; margin: 0; max-width: 11ch; font-size: 88px; font-weight: 600; line-height: 0.98; text-transform: uppercase; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #3ec6cf; }
</style>
</head>
<body>
  <img class="lido" src="../site/assets/lido-hero-1440.webp" alt="">
  <div class="brand"><img src="../site/assets/mark.svg" alt="">Salt IT</div>
  <p class="eyebrow">Salt IT · Brad · Based in Saltdean</p>
  <h1>Home IT support in Saltdean.</h1>
  <div class="bar"></div>
</body>
</html>
